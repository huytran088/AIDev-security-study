# version: 2026-04-25
# precision-first; add patterns liberally, remove only after sensitivity rerun
patterns:
  - regex: '(?i)\bgenerated by\b'
  - regex: '(?i)\bcreated with cursor\b'
  - regex: '(?i)\bdevin\b'
  - regex: '(?i)\bclaude code\b'
  - regex: '(?i)\bcodex\b'
  - regex: '(?i)\bopenai codex\b'
  - regex: '(?i)\bgithub copilot\b.*\bagent\b'
  - regex: '(?i)\bai[- ]assisted\b'
  - regex: '(?i)\bautomated pr\b'
  - regex: '(?i)\bauthored by an ai\b'
  - regex: '(?i)co-authored-by:\s+(claude|copilot|cursor|devin|codex)'