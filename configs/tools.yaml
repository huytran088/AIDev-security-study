# version: 2026-04-25
# category ∈ {SAST, SCA, Secrets, Fuzzing, CI Hardening}
tools:
  codeql:
    category: SAST
    workflow_uses:
      - github/codeql-action
    config_paths: []
  semgrep:
    category: SAST
    workflow_uses:
      - returntocorp/semgrep-action
      - semgrep/semgrep-action
    config_paths:
      - .semgrep.yml
      - .semgrep/
  sonarqube:
    category: SAST
    workflow_uses:
      - SonarSource/sonarqube-scan-action
      - SonarSource/sonarcloud-github-action
      - SonarSource/sonarqube-quality-gate-action
    config_paths:
      - sonar-project.properties
  bandit:
    category: SAST
    workflow_uses:
      - PyCQA/bandit-action
      - tj-actions/bandit
      - shundor/python-bandit-scan
    config_paths:
      - .bandit
      - bandit.yaml
      - bandit.yml
  checkov:
    category: SAST
    workflow_uses:
      - bridgecrewio/checkov-action
    config_paths:
      - .checkov.yml
      - .checkov.yaml
  tfsec:
    category: SAST
    workflow_uses:
      - aquasecurity/tfsec-pr-commenter-action
      - reviewdog/action-tfsec
    config_paths:
      - .tfsec/
      - tfsec.yml
  microsoft_security_devops:
    category: SAST
    workflow_uses:
      - microsoft/security-devops-action
    config_paths: []
  dependabot:
    category: SCA
    workflow_uses:
      - dependabot/fetch-metadata
    config_paths:
      - .github/dependabot.yml
      - .github/dependabot.yaml
  renovate:
    category: SCA
    workflow_uses:
      - renovatebot/github-action
    config_paths:
      - renovate.json
      - renovate.json5
      - .renovaterc
      - .renovaterc.json
  snyk:
    category: SCA
    workflow_uses:
      - snyk/actions
      - maximhq/snyk-actions
    config_paths:
      - .snyk
  trivy:
    category: SCA
    workflow_uses:
      - aquasecurity/trivy-action
      - aquasecurity/setup-trivy
    config_paths:
      - trivy.yaml
      - trivy.yml
      - .trivyignore
  anchore:
    category: SCA
    workflow_uses:
      - anchore/sbom-action
      - anchore/scan-action
    config_paths: []
  govulncheck:
    category: SCA
    workflow_uses:
      - golang/govulncheck-action
    config_paths: []
  gitleaks:
    category: Secrets
    workflow_uses:
      - gitleaks/gitleaks-action
      - zricethezav/gitleaks-action
      - reviewdog/action-gitleaks
    config_paths:
      - gitleaks.toml
      - .gitleaks.toml
  trufflehog:
    category: Secrets
    workflow_uses:
      - trufflesecurity/trufflehog
      - edplato/trufflehog-actions-scan
    config_paths: []
  ossf_scorecard:
    category: CI Hardening
    workflow_uses:
      - ossf/scorecard-action
    config_paths: []
  harden_runner:
    category: CI Hardening
    workflow_uses:
      - step-security/harden-runner
    config_paths: []
  oss_fuzz:
    category: Fuzzing
    workflow_uses:
      - google/oss-fuzz
      - google/clusterfuzzlite
    config_paths:
      - .clusterfuzzlite/
  claude_code_security_review:
    category: SAST
    workflow_uses:
      - anthropics/claude-code-security-review
    config_paths: []