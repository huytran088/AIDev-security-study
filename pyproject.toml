[project]
name = "AIDev-security-study"
version = "0.1.0"
description = "A study of impace of AI code generation on security, via mining the AIDev dataset. For MSR2026 challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hf>=1.12.0",
    "huggingface-hub>=0.27",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ratelimit>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "jupyterlab>=4.5.6",
    "jupytext>=1.19.1",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
